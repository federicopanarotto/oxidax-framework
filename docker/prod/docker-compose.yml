# production stack: API + SurrealDB.
#
# The API is configured through .env (the same file holds both the application
# variables and the compose ${...} interpolation, e.g. API_PUBLIC_PORT).
# Copy .env.example to .env and adapt the values.

services:
  surreal:
    image: surrealdb/surrealdb:v3.3.1
    command: start --bind 0.0.0.0:8000 --user ${SURREAL_USER:-root} --pass ${SURREAL_PASS:-root} file:/data/database.db
    volumes:
      - surreal-data:/data
    restart: unless-stopped

  api:
    image: oxidax:latest
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
    env_file:
      - .env
    ports:
      - "${API_PUBLIC_PORT:-3000}:3000"
    depends_on:
      - surreal
    # Uploaded files live on a named volume so they survive container restarts
    # (ASSETS_DIR in .env points here).
    volumes:
      - assets-data:/data/assets
    restart: unless-stopped

volumes:
  surreal-data:
  assets-data: