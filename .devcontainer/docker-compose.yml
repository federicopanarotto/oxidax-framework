services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target:/cargo-target
    command: sleep infinity
    ports:
      - "3000:3000"
    environment:
      RUST_LOG: info,oxidax=debug,oxidax_core=debug
      SERVER_ADDR: 0.0.0.0:3000
      DB_BACKEND: surreal
      SURREAL_URL: ws://surrealdb:12129
      SURREAL_USER: root
      SURREAL_PASS: root
      CARGO_TARGET_DIR: /cargo-target
    depends_on:
      - surrealdb

  surrealdb:
    image: surrealdb/surrealdb:latest
    command: start --user root --pass root --bind 0.0.0.0:12129
    ports:
      - "12129:12129"

volumes:
  cargo-registry:
  cargo-git:
  cargo-target:
