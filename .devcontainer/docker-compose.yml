services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target:/cargo-target
    command: sleep infinity
    ports:
      - "3000:3000"
    # NOTE: no `env_file: ../.env` here on purpose. The application loads `.env`
    # itself via dotenvy at startup, so changes to `.env` are picked up on every
    # `cargo dev` restart. Injecting it here too would freeze the values at
    # container creation (dotenvy never overrides already-set variables).
    environment:
      RUST_LOG: info,oxidax=debug,oxidax_core=debug
      CARGO_TARGET_DIR: /cargo-target
    # depends_on:
    #   - surrealdb

  # surrealdb:
  #   image: surrealdb/surrealdb:latest
  #   command: start --user root --pass root --bind 0.0.0.0:12129
  #   ports:
  #     - "12129:12129"

volumes:
  cargo-registry:
  cargo-git:
  cargo-target:
