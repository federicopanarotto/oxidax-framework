[package]
name = "oxidax-cli"
version = "0.1.0"
edition = "2024"
description = "Command-line tools of the Oxidax framework: Docker helpers and the feature code generator."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
oxidax = { path = ".." }
oxidax-core = { path = "../oxidax-core" }
